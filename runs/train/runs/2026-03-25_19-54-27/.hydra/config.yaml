env:
  paths:
    root_dir: ${oc.env:ROOT_DIR}
    data: ${oc.env:DATA_PATH}
    output_dir: ${hydra:runtime.output_dir}
    work_dir: ${hydra:runtime.cwd}
    log_dir: ${oc.env:RUNS_PATH}
    runs: ${oc.env:RUNS_PATH}
    run_dir: ${env.paths.runs}/${name}/${env.init_time}
  python:
    version: ${python_version:micro}
  init_time: ${now:%y-%m-%d_%H:%M:%S}
dataset:
  datamodule:
    _target_: proteinworkshop.datasets.fold_classification.FoldClassificationDataModule
    path: ${env.paths.data}/FoldClassification/
    split: fold
    batch_size: 32
    pin_memory: true
    num_workers: 0
    dataset_fraction: 1.0
    shuffle_labels: false
    transforms: ${transforms}
    overwrite: false
    in_memory: true
  num_classes: 1195
features:
  _target_: proteinworkshop.features.factory.ProteinFeaturiser
  representation: CA
  scalar_node_features:
  - amino_acid_one_hot
  - dihedrals
  - sidechain_torsions
  - alpha
  - kappa
  vector_node_features:
  - orientation
  edge_types:
  - knn_16
  scalar_edge_features:
  - edge_distance
  - edge_type
  - node_features
  - sequence_distance
  vector_edge_features:
  - edge_vectors
encoder:
  _target_: proteinworkshop.models.graph_encoders.gvp.GVPGNNModel
  s_dim: 128
  v_dim: 16
  s_dim_edge: 32
  v_dim_edge: 1
  r_max: 10.0
  num_bessel: 8
  num_polynomial_cutoff: 8
  num_layers: 5
  pool: sum
  residual: true
decoder:
  graph_label:
    _target_: proteinworkshop.models.decoders.mlp_decoder.MLPDecoder
    hidden_dim:
    - 512
    - 512
    dropout: 0.0
    activations:
    - leaky_relu
    - leaky_relu
    - none
    skip: false
    out_dim: ${dataset.num_classes}
    input: graph_embedding
    batch_norm: true
    batch_norm_output: false
transforms:
  remove_missing_ca:
    _target_: proteinworkshop.tasks.remove_missing_ca.RemoveMissingCa
    fill_value: 1.0e-05
    ca_idx: 1
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${env.paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: val/graph_label/accuracy
    verbose: true
    save_last: true
    save_top_k: 5
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: 1
    save_on_train_epoch_end: null
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/graph_label/accuracy
    min_delta: 0.0
    patience: 10
    verbose: true
    mode: max
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: false
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
  stop_on_nan:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: train/loss/total
    min_delta: 0.0
    patience: 10000000
    verbose: true
    mode: min
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: null
optimiser:
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0005
    weight_decay: 0.001
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.6
    patience: 5
    verbose: true
  interval: epoch
  frequency: 1
  monitor: val/loss/total
  strict: true
  name: learning_rate
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${env.paths.output_dir}
  min_epochs: 1
  max_epochs: 70
  accelerator: gpu
  check_val_every_n_epoch: 1
  deterministic: false
  num_sanity_val_steps: 2
  devices: 1
extras:
  ignore_warnings: true
  enforce_tags: false
  print_config: true
metrics:
  accuracy:
    _target_: torchmetrics.Accuracy
    task: ${task.classification_type}
    average: ${task.metric_average}
    num_classes: ${dataset.num_classes}
    top_k: 1
  f1_score:
    _target_: torchmetrics.F1Score
    average: macro
    num_classes: ${dataset.num_classes}
    task: ${task.classification_type}
  f1_max:
    _target_: proteinworkshop.metrics.f1_max.F1Max
    num_classes: ${dataset.num_classes}
task:
  task: classification
  classification_type: multiclass
  metric_average: micro
  losses:
    graph_label: cross_entropy
  label_smoothing: 0.0
  output:
  - graph_label
  supervise_on:
  - graph_label
logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    name: ${name}
    save_dir: ${env.paths.output_dir}
    offline: false
    id: null
    anonymous: null
    entity: ${oc.env:WANDB_ENTITY}
    project: ${oc.env:WANDB_PROJECT}
    log_model: false
    prefix: ''
    group: ''
    tags: []
    job_type: ''
name: gvp/fold_fold/0.0005/BN+WD_1e-3+x2
seed: 3810
num_workers: 16
task_name: train
test: true
